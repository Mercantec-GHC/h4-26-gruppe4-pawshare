services:
  backend:
    build:
      context: ./Backend
      dockerfile: API/Dockerfile
    ports:
      - "4043:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
      - Storage__MinIO__Endpoint=http://minio:9000
      - Storage__MinIO__BucketName=pawshare-uploads
      - Storage__MinIO__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - Storage__MinIO__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - minio
    networks:
      - app-network

  flutterweb:
    build:
      context: ./flutter_app
      dockerfile: DockerfileDev
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_ENV=dev
    ports:
      - "4044:80"
    depends_on:
      - backend
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  minio-data:
